name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          test "${RELEASE_TAG#v}" = "$(cat VERSION)"
      - run: make test
      - run: make test-sanitize
      - run: make package
      - name: Prepare reviewed release notes
        run: cp docs/release-notes.md dist/RELEASE-NOTES.md
      - name: Attest the GitHub-built installer
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.pkg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            dist/*.pkg
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
          if-no-files-found: error
          retention-days: 14
  publish-draft:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: dist
      - name: Create draft for final asset verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
          gh release create "$RELEASE_TAG" dist/*.pkg dist/SHA256SUMS.txt --verify-tag --draft --title "$RELEASE_TAG" --notes-file dist/RELEASE-NOTES.md
