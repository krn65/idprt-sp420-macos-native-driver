name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit, contract, integration, and package tests
        run: make test
      - name: AddressSanitizer and UndefinedBehaviorSanitizer
        run: make test-sanitize
      - name: Clang static analysis
        run: xcrun clang --analyze -std=c11 -Wno-deprecated-declarations -Xanalyzer -analyzer-output=text -o /dev/null src/rastertosp420.c
      - name: Build release package
        run: make package
      - name: Preserve package for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-package-${{ matrix.os }}
          path: |
            dist/*.pkg
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
